[package]
name = "squad-gitviz"
version = "0.1.0"
description = "Squad — local desktop Git visualizer"
authors = ["Wayne Yu"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "squad_gitviz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
